# CD del worker: en push a main ENSAYA en staging y luego despliega producción.
# Antes el deploy era manual (npx wrangler deploy) y main podía quedar verde con
# un worker viejo o una migración sin aplicar en producción (ya pasó: resolveScope
# lleva un try/catch por código desplegado antes de su migración).
#
# El ensayo en staging (2026-08-31) cierra el agujero que quedaba: hasta ahora la PRIMERA
# ejecución real de cualquier cambio era en producción, con los clientes dentro — los tests
# corren contra mocks y `migrations apply --remote` iba directo a la base con sus leads.
# Ahora todo pasa antes por vai-worker-staging, que tiene su propia D1 y su propio KV y
# ningún cliente detrás. Lo que rompa, rompe ahí.
#
# Semántica de fallo a mitad:
#  - falla `npm run check`        → no se toca nada, main queda rojo.
#  - falla cualquier paso de STAGING → producción NI SE ROZA. Es el punto del ensayo.
#  - falla `migrations apply` de prod → el worker no se despliega; producción intacta.
#  - migraciones OK, falla deploy → worker viejo + esquema nuevo ADITIVO = estado seguro
#    (regla de OPERATIONS.md: migración primero, deploy después). Relanzar el job:
#    `migrations apply` es idempotente (tabla d1_migrations) y el deploy se reintenta.
#
# Requiere el secret de GitHub Actions CLOUDFLARE_API_TOKEN con permisos mínimos:
# Account→Workers Scripts→Edit, Account→D1→Edit, Zone(hirevai.com)→Workers Routes→Edit
# (por el custom_domain admin.hirevai.com). NO reutilizar el CF_API_TOKEN del worker:
# tiene otros scopes (Turnstile/Access).
name: Deploy worker
on:
  push:
    branches: [main]
    # Un push de solo-HTML/blog no despliega el worker (Pages ya se autodespliega).
    # test/** entra a propósito: un cambio de tests puede poner esto rojo y debe bloquear.
    paths:
      - 'vai-worker.js'
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'test/**'
      - 'scripts/**'
      - 'seed/**'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
permissions:
  contents: read
# Dos pushes seguidos a main no se solapan: el segundo espera al primero
# (cancelar un deploy a medias es peor que encolarlo).
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Público: es el mismo CF_ACCOUNT_ID de wrangler.toml [vars].
      CLOUDFLARE_ACCOUNT_ID: 6a5877b5637ec5fa28d05af46e894542
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # El job es hermético: repite el check aunque ci.yml también lo corra.
      - run: npm run check
      # Migraciones ANTES del deploy (OPERATIONS.md §esquema): son aditivas y el
      # worker viejo convive con el esquema nuevo. Wrangler pineado a major (@4)
      # porque el repo no tiene lockfile; subir de major será un cambio consciente.
      # El panel viaja serializado con toString() y los tests sin bundlear no ven
      # los artefactos de esbuild (incidente __name, 2026-08-20): se valida el
      # arranque del panel CONTRA EL BUNDLE REAL antes de tocar producción.
      - run: npx wrangler@4 deploy --dry-run --outdir /tmp/dist && node scripts/check-bundle.mjs /tmp/dist/vai-worker.js

      # ── ENSAYO EN STAGING ───────────────────────────────────────────────────
      # Mismo código, otra D1, otro KV, ningún cliente. Si la migración está mal o el
      # worker no arranca, se ve aquí y producción no llega a enterarse.
      - name: staging · migraciones
        run: npx wrangler@4 d1 migrations apply vai-leads-staging --remote --env staging
      - name: staging · deploy
        run: npx wrangler@4 deploy --env staging
      - name: staging · humo
        run: |
          base=https://vai-worker-staging.botnexo-ia.workers.dev
          # 1. el worker arranca y responde CORS
          pre=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Origin: http://localhost:8080' -H 'Access-Control-Request-Method: POST' $base/chat)
          # 2. el binding de D1 vive: un tenant sembrado responde
          boot=$(curl -s -o /dev/null -w '%{http_code}' "$base/widget/boot?tenant=demo-staging")
          # 3. el panel NUNCA responde 200 sin autenticar. Dos cierres válidos:
          #    302 = Cloudflare Access delante (lo normal desde 2026-08-31)
          #    401 = el worker rechazando por su cuenta si Access no estuviera
          #    Lo que jamás puede salir de aquí es un 2xx.
          panel=$(curl -s -o /dev/null -w '%{http_code}' https://admin-staging.hirevai.com/api/admin/leads)
          echo "staging → preflight $pre · boot $boot · panel $panel"
          test "$pre" = "204" && test "$boot" = "200" \
            && { test "$panel" = "302" || test "$panel" = "401"; }

      # ── PRODUCCIÓN ──────────────────────────────────────────────────────────
      - name: producción · migraciones
        run: npx wrangler@4 d1 migrations apply vai-leads --remote
      - name: producción · deploy
        run: npx wrangler@4 deploy
      # Humo: el worker vivo responde el preflight CORS de /chat para un origen permitido.
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://hirevai.com' \
            -H 'Access-Control-Request-Method: POST' \
            https://vai-worker.botnexo-ia.workers.dev/chat)
          echo "preflight /chat -> $code"
          test "$code" = "204"
