name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Desde la migración a Hono el repo tiene dependencias (y lockfile): sin
      # instalar, los tests fallan en el primer `import 'hono'`.
      - run: npm ci
      - run: npm run check
      # Panel v2: sus tests y su build (incluye tsc --noEmit). Proyecto npm aparte
      # dentro de panel/ — un error de tipos del panel pone CI en rojo, a propósito.
      - name: panel v2 · tests y build
        working-directory: panel
        run: |
          npm ci
          npm test -- --run
          npm run build
