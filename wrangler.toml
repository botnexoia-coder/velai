# Config de deploy del worker de Velai (chat Vai + leads en D1 + panel admin).
# Sin declarar aquí los bindings KV y D1, un `wrangler deploy` los eliminaría del worker.
# El cron drena la cola de leads (leadq:* en KV), reintenta avisos y purga leads caducados.
name = "vai-worker"
main = "vai-worker.js"
compatibility_date = "2026-04-14"
# No pisar en cada deploy las variables puestas a mano en el dashboard
# (TELEGRAM_CHAT_ID/TEAM_WHATSAPP/TWILIO_FROM viven como secrets/vars remotos).
keep_vars = true

# El frontend llama a vai-worker.botnexo-ia.workers.dev: sin esta línea, declarar
# `routes` desactiva esa URL y rompe chat y formularios.
workers_dev = true

# Dominio del panel admin (Cloudflare Access delante; el Worker valida el JWT).
routes = [
  { pattern = "admin.hirevai.com", custom_domain = true },
  # api.hirevai.com: el widget llama aquí desde v=8 — workers.dev está en listas de
  # bloqueo (EasyPrivacy y afines) y a los visitantes con adblock el widget les salía
  # sin marca y con el chat muerto (descubierto en dialogosqueensenan.com, 2026-08-22).
  # workers_dev sigue true: los widgets v<=7 cacheados (immutable, 1 año) siguen vivos.
  { pattern = "api.hirevai.com", custom_domain = true }
]

[vars]
# BASE de la allowlist (los orígenes de Velai). Desde la migración 0008 los dominios de
# cliente viven en tenants.web_origins (D1, editables en el panel) y se UNEN a esta
# lista en allowedOrigins() — esta var sostiene nuestro sitio si D1 cae. Los de cliente
# de aquí abajo pueden migrarse a sus fichas y retirarse de esta línea con calma.
# El botón «Sincronizar Turnstile» del panel reescribe los hostnames del widget desde D1.
ALLOWED_WEB_ORIGINS = "https://hirevai.com,https://www.hirevai.com,https://velai-dey.pages.dev,https://hiredatavision.com,https://www.hiredatavision.com,https://gogestion.es,https://www.gogestion.es,https://zoetravelspain.com,https://www.zoetravelspain.com,https://dialogosqueensenan.com,https://www.dialogosqueensenan.com,https://gogestion-demo.pages.dev"
ADMIN_ORIGIN = "https://admin.hirevai.com"
LEAD_RETENTION_MONTHS = "24"
# Retención de TRANSCRIPCIONES (migración 0021), aparte y más corta que la de los leads:
# una conversación guardada es más sensible que una ficha de contacto. El cron la purga
# con el mismo LIMIT acotado. Si se cambia este número hay que reflejarlo en /privacidad/.
CONV_RETENTION_DAYS = "90"
# Tope diario GLOBAL de llamadas al modelo (presupuesto anti-abuso, resetea a medianoche UTC).
# Es exposición REAL de dinero: a ~0,006 $ por llamada (Sonnet, con el caché acertando),
# 2.000 llamadas/día son ~12 $/día en el peor caso. Subirlo sube esa cifra en proporción.
AI_DAILY_LIMIT = "2000"
# Tope diario POR TENANT (default; la columna tenants.ai_daily_limit lo pisa por fila).
# Un cliente con tráfico anómalo agota su cupo (429 ai_tenant_budget_exhausted) sin
# tumbar el chat de los demás.
# Subido de 300 a 1500 el 2026-08-26: 300 llamadas son ~37 conversaciones al día, y un
# cliente que creciera se comía un CORTE DURO mucho antes de que su saldo mensual dijera
# nada. Es un guarda anti-abuso, no un cupo comercial, y no debe hacer de cupo comercial.
# Ahora avisa a Velai al 80% (ai_tenant_budget_warning) para enterarnos ANTES de cortar.
AI_TENANT_DAILY_LIMIT = "1500"
# Saldo MENSUAL de tokens que el cliente ve en su panel (default; la columna
# tenants.ai_monthly_tokens lo pisa por fila). NO corta nada: es un contador.
# ~32.000 tokens por conversación medidos en producción → 5M son ~155 conversaciones/mes.
AI_TENANT_MONTHLY_TOKENS = "5000000"
# Tenant del canal web cuando el payload no trae `tenant` (el widget de hirevai.com).
DEFAULT_TENANT_SLUG = "velai"
# Admins de Velai en el panel (rol completo). Fuera de D1 a propósito: una fila
# borrada en tenant_users no puede dejar a Velai fuera de su propio panel.
ADMIN_EMAILS = "botnexo.ia@gmail.com"
# API de Cloudflare desde el worker (SPEC-ORIGENES-Y-TURNSTILE + SPEC-ACCESO):
# el token va como SECRET (wrangler secret put CF_API_TOKEN) con permisos mínimos:
# Account→Turnstile→Edit, Account→Access: Organizations/IdPs/Groups→Edit y
# Zone(hirevai.com)→Access: Apps and Policies→Edit. Estos tres son públicos/ids.
CF_ACCOUNT_ID = "6a5877b5637ec5fa28d05af46e894542"
TURNSTILE_SITEKEY = "0x4AAAAAAESkAwvlDVJD9Z1l"
# OAuth de Google Calendar (SPEC-CALENDARIO): el client id es público por diseño de
# OAuth; el secret va como SECRET (wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET).
# Vacío = la función de calendario queda APAGADA (los endpoints responden 503 y el
# chat funciona sin citas). Rellenar con el client id del proyecto velai-calendar.
GOOGLE_OAUTH_CLIENT_ID = "1059741045199-puqu4mcvbc8fmfj34puqdpo72tenb2a2.apps.googleusercontent.com"
# Id del grupo de Access «Clientes Velai» (creado el 2026-08-18 vía API; la política
# «Clientes Velai» de la app admin.hirevai.com lo incluye, aparte de la de admins).
CF_ACCESS_GROUP_ID = "e08705f9-5d71-457e-9628-13bdaf034435"
# Grupo «Admins Velai» (creado 2026-08-18): el panel lo reescribe al gestionar admins
# (env ADMIN_EMAILS = raíz, siempre incluidos). Va en la política por-app «Admins
# Velai». La política «Equipo Velai» del dashboard es REUTILIZABLE y el worker no puede
# ni quiere tocarla: es la garantía externa de los admins raíz.
CF_ADMIN_GROUP_ID = "92360e3f-8e40-4dfd-85e6-718617d140d0"

# Workers Logs: sin este bloque cada deploy lo deja APAGADO y los logs operativos
# (tenant_token_undecryptable, provision_orphan, lead_d1_fallback,
# twilio_duplicate_ignored, ai_tenant_budget_exhausted, telegram_linked,
# telegram_unlinked, telegram_link_expired, telegram_webhook_registered,
# telegram_bot_saved, telegram_bot_removed, telegram_bot_undecryptable,
# telegram_whitelabel_toggled, telegram_topic_registered, telegram_topic_ignored,
# sender_webhook_fix_failed, calendar_connected,
# calendar_disconnected, calendar_refresh_failed, calendar_token_undecryptable,
# calendar_tool_failed, calendar_reply_failed, appointment_created,
# tool_loop_overflow…) no se ven en ninguna parte.
# Los logs no llevan PII por diseño, así que muestreo al 100%.
# Códigos nuevos: ai_tenant_budget_warning (un cliente pasó del 80% de su cupo DIARIO:
# avisa antes de que el 429 corte, que es el punto de haberlo subido), reply_truncated (el modelo se quedó sin max_tokens y la respuesta salió
# recortada a la última frase completa — si un cliente lo repite, súbele el tope de su
# canal), agent_reply (respuesta humana desde la bandeja), weekly_report (un informe semanal por cliente y semana, con su estado:
# sent / skipped / failed), weekly_report_failed (el bloque entero falló; los avisos de
# leads siguen), conv_state_not_saved (el turno NO se guardó en D1: el visitante recibió
# su respuesta pero el turno siguiente irá sin memoria — es el código a vigilar del
# historial), conv_lead_not_linked, conv_purge_failed (la retención no pudo purgar),
# conv_not_counted (conversación no contada), cf_analytics_denied
# (el token no puede leer analíticas de Cloudflare), ai_usage_not_recorded (el registro de gasto falló, la respuesta al
# cliente NO), sender_profile_synced / sender_profile_sync_failed (foto de WhatsApp).
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# DOS relojes a propósito:
#  - cada MINUTO: solo los tiempos de la cola de espera (docs/H2-HANDOFF.md). Con */5, «5
#    minutos» eran en realidad 5-10 y «15» eran 15-20.
#  - cada 5 MINUTOS: todo lo demás. No se puede subir a un minuto porque drainQueuedLeads
#    hace un LISTADO de KV por tick y el plan gratuito da 1.000 listados/día: a 1.440 ticks
#    se pasaría, y los listados son el segundo cuello real del sistema (ver
#    docs/VOLUMEN-Y-ALMACENAMIENTO.md). Además multiplicaría por 5 los reintentos a Twilio.
crons = ["* * * * *", "*/5 * * * *"]

# Medios (logos de marca → widget + foto de perfil de WhatsApp). Hoy viven en KV con
# prefijo `media:`; R2 es el sitio natural pero exige activarlo UNA VEZ en el dashboard
# (la API responde 10042 «Please enable R2» mientras no lo esté). Cuando se active:
# `npx wrangler@4 r2 bucket create vai-media` y descomentar — las subidas nuevas irán a
# R2 y las viejas se siguen sirviendo desde KV (mediaGet mira los dos).
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "vai-media"

[[kv_namespaces]]
binding = "KV"
id = "14fbc395a218428bb677f61243c9e3f6"

[[d1_databases]]
binding = "DB"
database_name = "vai-leads"
database_id = "4b3056eb-6dee-44a4-8d17-5a80af740ca5"

# ═══════════════════════════════════════════════════════════════════════════════
# ENTORNO DE STAGING — el ensayo que faltaba
# ═══════════════════════════════════════════════════════════════════════════════
# Antes de esto, la PRIMERA ejecución real de cada cambio era en producción, con los
# clientes dentro: los tests corren contra mocks y `d1 migrations apply --remote` iba
# directo a la base con sus leads y conversaciones. Los tres incidentes que costaron
# check-bundle.mjs, render-panel.mjs y el try/catch de resolveScope son el mismo agujero.
#
# Copia completa e independiente: worker propio, D1 propia, KV propio, cero clientes.
#
#   Desplegar a mano:  npx wrangler@4 deploy --env staging
#   Migraciones:       npx wrangler@4 d1 migrations apply vai-leads-staging --remote --env staging
#   URL:               https://vai-worker-staging.botnexo-ia.workers.dev
#
# ⚠️ CUIDADO CON LO QUE SE HEREDA. En wrangler, un [env.X] hereda `routes` y `triggers`
# del bloque raíz pero NO hereda `vars`, `kv_namespaces` ni `d1_databases`. Es decir:
# lo peligroso se hereda solo y lo inofensivo hay que repetirlo. Sin el `routes` de
# abajo, un `deploy --env staging` RECLAMARÍA admin.hirevai.com y api.hirevai.com y
# dejaría a los clientes servidos por el worker de staging. De ahí que esté explícito.
[env.staging]
name = "vai-worker-staging"
workers_dev = true

# El único dominio de staging. Vacío no vale: sin la lista, hereda la de producción.
# admin-staging.hirevai.com FALLA CERRADO mientras no tenga Cloudflare Access delante:
# adminIdentity() exige la cabecera Cf-Access-Jwt-Assertion y sin ella todo /api/admin/*
# responde 401. No hay ventana de panel abierto (ver docs/OPERATIONS.md §Staging).
routes = [
  { pattern = "admin-staging.hirevai.com", custom_domain = true }
]

# Sin cron en staging, a propósito. drainQueuedLeads hace un LISTADO de KV por tick y el
# plan gratuito da 1.000 al día para toda la cuenta: producción ya gasta ~288 y duplicarlo
# se come la mitad del margen que docs/VOLUMEN-Y-ALMACENAMIENTO.md señala como cuello real.
# Para probar el cron: `npx wrangler@4 dev --env staging --test-scheduled` y llamar a
# /__scheduled?cron=*+*+*+*+*, que no gasta cuota de producción.
[env.staging.triggers]
crons = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
# Las de abajo son las MISMAS claves que [vars] de producción con valores de staging.
# scripts/check-entornos.mjs falla si una clave existe en un lado y no en el otro: la
# duplicación es inevitable (wrangler no hereda vars), que se desincronice en silencio no.
# example.com está aquí por una razón concreta y NO es un descuido: la clave de PRUEBA de
# Turnstile emite sus tokens con hostname "example.com", y verifyTurnstile rechaza todo
# token cuyo hostname no esté en esta lista (worker/app.js:168). Sin esta entrada, POST
# /chat en staging responde 403 human_verification_failed SIEMPRE y el entorno no puede
# probar el chat — que es la mitad del producto. En producción no aparece ni debe aparecer.
ALLOWED_WEB_ORIGINS = "http://localhost:8080,http://127.0.0.1:8080,https://velai-dey.pages.dev,https://example.com"
ADMIN_ORIGIN = "https://admin-staging.hirevai.com"
LEAD_RETENTION_MONTHS = "24"
CONV_RETENTION_DAYS = "90"
# Topes de gasto MUY por debajo de producción: staging usa una clave real de Anthropic y
# un bucle mal escrito aquí gasta dinero de verdad. 100 llamadas/día son ~0,60 $ en el
# peor caso — suficiente para probar y demasiado poco para hacer daño.
AI_DAILY_LIMIT = "100"
AI_TENANT_DAILY_LIMIT = "50"
AI_TENANT_MONTHLY_TOKENS = "5000000"
DEFAULT_TENANT_SLUG = "velai"
ADMIN_EMAILS = "botnexo.ia@gmail.com"
CF_ACCOUNT_ID = "6a5877b5637ec5fa28d05af46e894542"
# Sitekey de PRUEBA de Turnstile (siempre válida). Su secreto va en el .dev.vars y como
# secret de staging: 1x0000000000000000000000000000000AA.
TURNSTILE_SITEKEY = "1x00000000000000000000AA"
# Calendario APAGADO en staging: sin client id, los endpoints responden 503 y el chat
# funciona igual. Rellenar solo para probar el flujo OAuth, con el proyecto de pruebas.
GOOGLE_OAUTH_CLIENT_ID = ""
# ⚠️ VACÍOS A PROPÓSITO, Y NO SE RELLENAN. Son los ids de los grupos de Cloudflare Access
# de PRODUCCIÓN. Con ellos puestos, gestionar usuarios desde el panel de staging
# reescribiría quién entra en el panel de los clientes reales. Vacíos, syncPanelGate y
# syncAdminGate devuelven 'manual' y no llaman a la API de Access (worker/app.js:2540).
CF_ACCESS_GROUP_ID = ""
CF_ADMIN_GROUP_ID = ""

[[env.staging.kv_namespaces]]
binding = "KV"
id = "d522cc2ef3f54e1f91a35dc90d0df1bc"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "vai-leads-staging"
database_id = "4fe5d8b0-17d8-4ac1-a3f7-216c5e085a75"
