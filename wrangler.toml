# Config de deploy del worker de Velai (chat Vai + leads en D1 + panel admin).
# Sin declarar aquí los bindings KV y D1, un `wrangler deploy` los eliminaría del worker.
# El cron drena la cola de leads (leadq:* en KV), reintenta avisos y purga leads caducados.
name = "vai-worker"
main = "vai-worker.js"
compatibility_date = "2026-04-14"
# No pisar en cada deploy las variables puestas a mano en el dashboard
# (TELEGRAM_CHAT_ID/TEAM_WHATSAPP/TWILIO_FROM viven como secrets/vars remotos).
keep_vars = true

# El frontend llama a vai-worker.botnexo-ia.workers.dev: sin esta línea, declarar
# `routes` desactiva esa URL y rompe chat y formularios.
workers_dev = true

# Dominio del panel admin (Cloudflare Access delante; el Worker valida el JWT).
routes = [
  { pattern = "admin.hirevai.com", custom_domain = true }
]

[vars]
# El alias de Pages permite validar chat/formularios en preview antes de mergear.
# Cualquier hostname añadido aquí debe añadirse TAMBIÉN al widget de Turnstile.
# Incluye los dominios de los 4 clientes solo-web (SPEC-CANAL-WEB §7): su chat y su
# formulario llaman al worker desde SU origen.
ALLOWED_WEB_ORIGINS = "https://hirevai.com,https://www.hirevai.com,https://velai-dey.pages.dev,https://hiredatavision.com,https://www.hiredatavision.com,https://gogestion.es,https://www.gogestion.es,https://zoetravelspain.com,https://www.zoetravelspain.com,https://dialogosqueensenan.com,https://www.dialogosqueensenan.com,https://gogestion-demo.pages.dev"
ADMIN_ORIGIN = "https://admin.hirevai.com"
LEAD_RETENTION_MONTHS = "24"
# Tope diario global de llamadas al modelo (presupuesto anti-abuso, resetea a medianoche UTC).
AI_DAILY_LIMIT = "1000"
# Tenant del canal web cuando el payload no trae `tenant` (el widget de hirevai.com).
DEFAULT_TENANT_SLUG = "velai"
# Admins de Velai en el panel (rol completo). Fuera de D1 a propósito: una fila
# borrada en tenant_users no puede dejar a Velai fuera de su propio panel.
ADMIN_EMAILS = "botnexo.ia@gmail.com"

# Workers Logs: sin este bloque cada deploy lo deja APAGADO y los logs operativos
# (tenant_token_undecryptable, provision_orphan, lead_d1_fallback…) no se ven en
# ninguna parte. Los logs no llevan PII por diseño, así que muestreo al 100%.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "14fbc395a218428bb677f61243c9e3f6"

[[d1_databases]]
binding = "DB"
database_name = "vai-leads"
database_id = "4b3056eb-6dee-44a4-8d17-5a80af740ca5"
