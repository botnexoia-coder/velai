# Config de deploy del worker de Velai (chat Vai + leads en D1 + panel admin).
# Sin declarar aquí los bindings KV y D1, un `wrangler deploy` los eliminaría del worker.
# El cron drena la cola de leads (leadq:* en KV), reintenta avisos y purga leads caducados.
name = "vai-worker"
main = "vai-worker.js"
compatibility_date = "2026-04-14"
# No pisar en cada deploy las variables puestas a mano en el dashboard
# (TELEGRAM_CHAT_ID/TEAM_WHATSAPP/TWILIO_FROM viven como secrets/vars remotos).
keep_vars = true

# El frontend llama a vai-worker.botnexo-ia.workers.dev: sin esta línea, declarar
# `routes` desactiva esa URL y rompe chat y formularios.
workers_dev = true

# Dominio del panel admin (Cloudflare Access delante; el Worker valida el JWT).
routes = [
  { pattern = "admin.hirevai.com", custom_domain = true }
]

[vars]
# BASE de la allowlist (los orígenes de Velai). Desde la migración 0008 los dominios de
# cliente viven en tenants.web_origins (D1, editables en el panel) y se UNEN a esta
# lista en allowedOrigins() — esta var sostiene nuestro sitio si D1 cae. Los de cliente
# de aquí abajo pueden migrarse a sus fichas y retirarse de esta línea con calma.
# El botón «Sincronizar Turnstile» del panel reescribe los hostnames del widget desde D1.
ALLOWED_WEB_ORIGINS = "https://hirevai.com,https://www.hirevai.com,https://velai-dey.pages.dev,https://hiredatavision.com,https://www.hiredatavision.com,https://gogestion.es,https://www.gogestion.es,https://zoetravelspain.com,https://www.zoetravelspain.com,https://dialogosqueensenan.com,https://www.dialogosqueensenan.com,https://gogestion-demo.pages.dev"
ADMIN_ORIGIN = "https://admin.hirevai.com"
LEAD_RETENTION_MONTHS = "24"
# Tope diario GLOBAL de llamadas al modelo (presupuesto anti-abuso, resetea a medianoche UTC).
AI_DAILY_LIMIT = "1000"
# Tope diario POR TENANT (default; la columna tenants.ai_daily_limit lo pisa por fila).
# Un cliente con tráfico anómalo agota su cupo (429 ai_tenant_budget_exhausted) sin
# tumbar el chat de los demás.
AI_TENANT_DAILY_LIMIT = "300"
# Tenant del canal web cuando el payload no trae `tenant` (el widget de hirevai.com).
DEFAULT_TENANT_SLUG = "velai"
# Admins de Velai en el panel (rol completo). Fuera de D1 a propósito: una fila
# borrada en tenant_users no puede dejar a Velai fuera de su propio panel.
ADMIN_EMAILS = "botnexo.ia@gmail.com"
# API de Cloudflare desde el worker (SPEC-ORIGENES-Y-TURNSTILE + SPEC-ACCESO):
# el token va como SECRET (wrangler secret put CF_API_TOKEN) con permisos mínimos:
# Account→Turnstile→Edit, Account→Access: Organizations/IdPs/Groups→Edit y
# Zone(hirevai.com)→Access: Apps and Policies→Edit. Estos tres son públicos/ids.
CF_ACCOUNT_ID = "6a5877b5637ec5fa28d05af46e894542"
TURNSTILE_SITEKEY = "0x4AAAAAAESkAwvlDVJD9Z1l"
# OAuth de Google Calendar (SPEC-CALENDARIO): el client id es público por diseño de
# OAuth; el secret va como SECRET (wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET).
# Vacío = la función de calendario queda APAGADA (los endpoints responden 503 y el
# chat funciona sin citas). Rellenar con el client id del proyecto velai-calendar.
GOOGLE_OAUTH_CLIENT_ID = "1059741045199-puqu4mcvbc8fmfj34puqdpo72tenb2a2.apps.googleusercontent.com"
# Id del grupo de Access «Clientes Velai» (creado el 2026-08-18 vía API; la política
# «Clientes Velai» de la app admin.hirevai.com lo incluye, aparte de la de admins).
CF_ACCESS_GROUP_ID = "e08705f9-5d71-457e-9628-13bdaf034435"
# Grupo «Admins Velai» (creado 2026-08-18): el panel lo reescribe al gestionar admins
# (env ADMIN_EMAILS = raíz, siempre incluidos). Va en la política por-app «Admins
# Velai». La política «Equipo Velai» del dashboard es REUTILIZABLE y el worker no puede
# ni quiere tocarla: es la garantía externa de los admins raíz.
CF_ADMIN_GROUP_ID = "92360e3f-8e40-4dfd-85e6-718617d140d0"

# Workers Logs: sin este bloque cada deploy lo deja APAGADO y los logs operativos
# (tenant_token_undecryptable, provision_orphan, lead_d1_fallback,
# twilio_duplicate_ignored, ai_tenant_budget_exhausted, calendar_connected,
# calendar_disconnected, calendar_refresh_failed, calendar_token_undecryptable,
# calendar_tool_failed, calendar_reply_failed, appointment_created,
# tool_loop_overflow…) no se ven en ninguna parte.
# Los logs no llevan PII por diseño, así que muestreo al 100%.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "14fbc395a218428bb677f61243c9e3f6"

[[d1_databases]]
binding = "DB"
database_name = "vai-leads"
database_id = "4b3056eb-6dee-44a4-8d17-5a80af740ca5"
